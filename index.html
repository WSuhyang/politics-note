<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정치백과 — 관계도 · 공약 · 용어</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="data.js?v=20261028"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("theme")||"light"}catch(e){}</script>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#111827; --muted:#6b7280; --border:#e5e7eb; --accent:#2563eb;
    --dem:#2563eb; --con:#dc2626; --mid:#9ca3af;
    --rel-family:#9333ea; --rel-lineage:#2563eb; --rel-faction:#0d9488; --rel-school:#94a3b8; --rel-rival:#dc2626;
  }
  html[data-theme="dark"]{
    --bg:#0f1115; --card:#171a21; --ink:#e5e7eb; --muted:#9ca3af; --border:#262b36; --accent:#3b82f6;
    --dem:#3b82f6; --con:#ef4444; --mid:#6b7280;
    --rel-family:#c084fc; --rel-lineage:#60a5fa; --rel-faction:#2dd4bf; --rel-school:#8b95a5; --rel-rival:#f87171;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  header h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
  header .tag{font-size:12px;color:var(--muted)}
  #theme-toggle{margin-left:auto;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:14px}
  nav{display:flex;gap:4px;padding:0 28px;background:var(--card);border-bottom:1px solid var(--border)}
  nav button{border:none;background:none;padding:11px 14px;font-size:14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  main{padding:22px 28px 80px;max-width:1320px}
  .page{display:none}.page.active{display:block}
  .hint{font-size:13px;color:var(--muted);margin-bottom:14px}
  .hint b{color:var(--ink)}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .toolbar input,.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--card);color:var(--ink)}
  .toolbar input{width:210px}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* ===== 관계도 (가로 타임라인) ===== */
  #graph-scroll{overflow-x:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 0}
  /* 오른쪽 인물 프로필 고정 구역 */
  #note-side{width:400px;flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px 24px;overflow-y:auto;max-height:640px}
  #note-side .note{padding:0;box-shadow:none;border:none;border-radius:0;height:auto;max-height:none;animation:none;width:auto;background:transparent}
  #graph-scroll::-webkit-scrollbar{height:8px}
  #graph-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .link{stroke-opacity:.45}
  .node circle,.node rect{cursor:pointer}
  .node text{font-size:12px;pointer-events:none;paint-order:stroke;stroke:var(--card);stroke-width:3px;fill:var(--ink)}
  .node.faded{opacity:.12}
  .gridline{stroke:var(--border);stroke-dasharray:2,4}
  .gridlabel{font-size:10.5px;fill:var(--muted)}
  #tooltip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 12px;border-radius:8px;font-size:12px;line-height:1.55;max-width:280px;opacity:0;transition:opacity .12s;z-index:30}
  #tooltip .t-name{font-size:14px;font-weight:700;margin-bottom:3px}
  #tooltip .t-sub{opacity:.75}

  /* 인물 노트 — 인물백과 등에서는 중앙 모달, 관계도 탭에서는 우측 고정 구역(#note-side) */
  #note-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:20;align-items:center;justify-content:center}
  #note-overlay.open{display:flex}
  .note{background:var(--card);border-radius:14px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;padding:26px 30px;position:relative}
  .note h2{font-size:22px;margin-bottom:2px}
  .note .n-sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .note h4{font-size:13px;color:var(--accent);margin:16px 0 6px}
  .note ul{padding-left:18px;font-size:13.5px;line-height:1.7}
  .note .n-close{position:absolute;top:14px;right:16px;border:none;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
  .note .n-badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--accent);margin-right:6px}
  .note .n-src{margin-top:18px;padding-top:10px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted)}
  .n-avatar{width:84px;height:84px;border-radius:50%;object-fit:cover;object-position:top;float:right;margin:0 0 10px 16px;border:3px solid var(--border);background:var(--bg)}

  /* ===== 정당 지도 ===== */
  .party-row{display:grid;grid-template-columns:170px 1fr 200px;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:8px}
  .party-row .pname{font-weight:700;font-size:15px}
  .party-row .pleader{font-size:12px;color:var(--muted)}
  .pbar{height:22px;border-radius:6px;background:var(--bg);overflow:hidden}
  .pbar>div{height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;color:#fff;font-size:12px;font-weight:600}
  .pseats{font-size:13px;text-align:right}.pseats b{font-size:17px}
  .tab-btn{padding:7px 13px;border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;cursor:pointer;font-size:13px}
  .tab-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* ===== 공약 ===== */
  .pol-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
  .pol-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  .pol-card h3{font-size:16px;display:flex;justify-content:space-between;align-items:baseline}
  .pol-card h3 .who{font-size:12px;color:var(--muted);font-weight:400}
  .score-row{display:flex;align-items:baseline;gap:8px;margin:10px 0 4px}
  .score{font-size:32px;font-weight:800;letter-spacing:-.03em;color:var(--accent)}
  .score small{font-size:13px;font-weight:400;color:var(--muted)}
  .rate-tag{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--border);color:var(--muted)}
  .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin:6px 0 12px}
  .bar>div{height:100%;border-radius:4px;background:var(--accent)}
  details.promise{border-top:1px dashed var(--border);padding:9px 0;font-size:13px}
  details.promise summary{cursor:pointer;display:flex;gap:8px;align-items:center;list-style:none}
  details.promise summary::-webkit-details-marker{display:none}
  .st{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .st-kept{background:#dcfce7;color:#15803d}.st-partial{background:#fef3c7;color:#a16207}
  .st-broken{background:#fee2e2;color:#b91c1c}.st-progress{background:#dbeafe;color:#1d4ed8}
  html[data-theme="dark"] .st-kept{background:#14351f;color:#4ade80}
  html[data-theme="dark"] .st-partial{background:#3a2f14;color:#fbbf24}
  html[data-theme="dark"] .st-broken{background:#3b1a1a;color:#f87171}
  html[data-theme="dark"] .st-progress{background:#172a4a;color:#60a5fa}
  .evidence{margin-top:6px;color:var(--muted);font-size:12px;line-height:1.6}
  .pnews{display:block;margin-top:5px;font-size:12px;color:var(--accent);text-decoration:none;line-height:1.45}
  .pnews:hover{text-decoration:underline}
  .pnews span{color:var(--muted);font-size:11px}
  .cmp-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-top:20px}
  .cmp-table th,.cmp-table td{padding:10px 14px;border-bottom:1px solid var(--border);text-align:left}
  .cmp-table th{background:var(--bg);font-size:12px;color:var(--muted)}

  /* ===== 용어 사전 (심플 리스트) ===== */
  .dict-group{margin-bottom:6px}
  .dict-head{font-size:13px;font-weight:700;color:var(--muted);padding:14px 4px 8px;border-bottom:1px solid var(--border)}
  .dict-row{display:grid;grid-template-columns:170px 1fr;gap:16px;padding:13px 4px;border-bottom:1px solid var(--border);align-items:baseline}
  .dict-term{font-weight:700;font-size:15px}
  .dict-term .cat{font-size:10.5px;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px;font-weight:400}
  .dict-def{font-size:13.5px;color:var(--ink);line-height:1.7}
  .dict-news{margin-top:4px;font-size:11.5px}
  .dict-news a{color:var(--accent);text-decoration:none;margin-right:12px}
  .dict-news a:hover{text-decoration:underline}
  .dict-news span{color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>정치백과</h1>
  <span class="tag">정치 입문자를 위한 관계도 · 공약 추적 · 용어 사전</span>
  <button id="theme-toggle" title="다크/라이트">🌙</button>
</header>
<nav>
  <button id="tab-rel" class="active">정치 관계도</button>
  <button id="tab-people">인물백과</button>
  <button id="tab-pol">정책백과</button>
  <button id="tab-prom">공약 이행도</button>
  <button id="tab-gloss">용어 사전</button>
</nav>
<main>
  <section id="page-rel" class="page active">
    <div class="toolbar">
      <input type="search" id="search" placeholder="인물 검색 (예: 이재명)">
      <select id="camp-filter">
        <option value="all">진영: 전체</option>
        <option value="con">보수</option>
        <option value="dem">민주진영</option>
        <option value="mid">제3지대·진보</option>
      </select>
      <select id="role-filter">
        <option value="all">직급: 전체</option>
        <option value="대통령">대통령</option>
        <option value="총리·장관">총리·장관</option>
        <option value="국회의원">국회의원</option>
        <option value="지방단체장">지방단체장</option>
        <option value="독립·건국">독립·건국</option>
      </select>
      <select id="rel-filter">
        <option value="all">관계: 전체</option>
        <option value="family">가족</option>
        <option value="lineage">계보 (○○키즈)</option>
        <option value="faction">계파/합당</option>
        <option value="school">동문/동료</option>
        <option value="rival">라이벌</option>
      </select>
      <div class="legend">
        <span><i style="display:inline-block;width:22px;border-top:3px solid var(--rel-family);vertical-align:middle"></i>혈연·가족</span>
        <span><i style="display:inline-block;width:22px;border-top:2.6px solid var(--rel-lineage);vertical-align:middle"></i>계보·후계</span>
        <span><i style="display:inline-block;width:22px;border-top:2.6px solid var(--rel-faction);vertical-align:middle"></i>동맹·협력</span>
        <span><i style="display:inline-block;width:22px;border-top:2px dotted var(--rel-school);vertical-align:middle"></i>동문·동료</span>
        <span><i style="display:inline-block;width:22px;border-top:2.6px dashed var(--rel-rival);vertical-align:middle"></i>갈등·경쟁</span>
      </div>
    </div>
    <div style="display:flex;gap:14px;align-items:stretch">
      <div id="graph-scroll" style="flex:1;min-width:0"><svg id="graph-svg" height="620"></svg></div>
      <aside id="note-side" aria-label="인물 프로필"></aside>
    </div>
    <div id="party-map" style="margin-top:18px"></div>
  </section>

  <section id="page-people" class="page">
    <div class="toolbar">
      <input type="search" id="people-search" placeholder="인물 검색 (예: 이준석, 대통령, 민주당)">
      <select id="people-camp">
        <option value="all">진영: 전체</option><option value="con">보수</option>
        <option value="dem">민주진영</option><option value="mid">제3지대·진보</option>
      </select>
      <select id="people-role">
        <option value="all">직급: 전체</option><option value="대통령">대통령</option>
        <option value="총리·장관">총리·장관</option><option value="국회의원">국회의원</option>
        <option value="지방단체장">지방단체장</option><option value="독립·건국">독립·건국</option>
      </select>
      <span id="people-count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="people-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px"></div>
  </section>

  <section id="page-pol" class="page">
    <div class="toolbar">
      <input type="search" id="pol-search" placeholder="정책 검색 (예: 새마을, FTA, 복지)">
      <select id="pol-gov">
        <option value="all">정부: 전체</option>
        ${""}
      </select>
      <span id="pol-count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div class="toolbar" id="pol-cat" style="margin-bottom:14px"></div>
    <div id="policy-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px"></div>
  </section>

  <section id="page-prom" class="page">
    <p class="hint">💡 대통령 공약은 언론·시민단체 공식 집계 인용, 그 외는 <b>보도 기반 자체 집계</b>(이행 1 · 부분 0.5 · 진행 0.25 가중). 각 공약을 펼치면 <b>진행 상황과 관련 뉴스 기사</b>(클릭 시 새 탭)가 나옵니다.</p>
    <div class="toolbar" id="prom-filter"></div>
    <div class="pol-grid" id="pol-grid"></div>
  </section>

  <section id="page-gloss" class="page">
    <div class="toolbar">
      <input type="search" id="gloss-search" placeholder="용어 검색 (예: TK, 탄핵, 계파)" style="width:320px">
      <span id="gloss-count" style="font-size:12px;color:var(--muted)"></span>
    </div>
    <div id="gloss-dict"></div>
  </section>
</main>

<div id="note-overlay"><div class="note" id="note-body"></div></div>
<div id="tooltip"></div>

<script>
const DATA = DB.graph;
const GLOSSARY = DB.glossary;
const SRC_WIKI = "위키백과 · 2026-10 수집";

// ===== 탭 =====
function showTab(t){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>showTab(b.id.replace('tab-',''))));

// ===== 테마 =====
(function(){
  const btn=document.getElementById('theme-toggle');
  const apply=t=>{document.documentElement.dataset.theme=t;btn.textContent=t==='dark'?'☀️':'🌙';try{localStorage.setItem('theme',t)}catch(e){}};
  apply(document.documentElement.dataset.theme||'light');
  btn.addEventListener('click',()=>apply(document.documentElement.dataset.theme==='dark'?'light':'dark'));
})();

// ===== 1) 관계도 — 가로 타임라인 레이아웃 =====
const campColor={dem:"var(--dem)",con:"var(--con)",mid:"var(--mid)"};
const typeColor={family:"var(--rel-family)",lineage:"var(--rel-lineage)",faction:"var(--rel-faction)",school:"var(--rel-school)",rival:"var(--rel-rival)"};

const H=660, TOP=70, BOT=60, MIDY=(TOP+H-BOT)/2+40;
const presByName={}; DB.presidents.forEach(p=>presByName[p.name]=p);
const presSorted=[...DB.presidents].sort((a,b)=>a.from-b.from);
const isNonPres=p=>p.n==="내각"||p.n==="대행";

// x축: 실제 시간 비례 (장기 재임자는 넓게). 극단 겹침(1979~80)만 최소간격 보정
const YEAR0=1946, YEAR1=2029;
const GRAPH_W=2150;
const xOf=year=>80+(year-YEAR0)/(YEAR1-YEAR0)*(GRAPH_W-160);
const presX={};
{
  let last=-1e9;
  presSorted.forEach(p=>{
    let x=xOf(p.from);
    const minGap=isNonPres(p)?70:62;
    if(x-last<minGap)x=last+minGap;
    presX[p.name]=x; last=x;
  });
}

const svg=d3.select("#graph-svg").attr("width",GRAPH_W).attr("height",H);
const defs=svg.append("defs");
const gAxis=svg.append("g"), gYears=svg.append("g"), gBars=svg.append("g"), gLink=svg.append("g"), gHit=svg.append("g"), gNode=svg.append("g");
const tooltip=d3.select("#tooltip");

// 상단 연대 눈금 + 굵직한 사건
d3.range(1950,2030,10).forEach(y=>{
  const x=xOf(y);
  gAxis.append("line").attr("x1",x).attr("x2",x).attr("y1",26).attr("y2",H-30).attr("class","gridline");
  gAxis.append("text").attr("x",x).attr("y",16).attr("text-anchor","middle").attr("class","gridlabel").style("font-weight",700).text(y+"년대");
});
(DB.events||[]).forEach(ev=>{
  const x=xOf(ev.year+0.5);
  gAxis.append("text").attr("x",x).attr("y",40).attr("text-anchor","middle")
    .style("font-size","10.5px").style("fill","var(--con)").style("font-weight",600)
    .text("⚑ "+ev.label);
});

// 1년 단위 눈금 + 연도 호버 존 (그 해의 사건 요약 툴팁)
const yearEventMap={};(DB.yearEvents||[]).forEach(ye=>yearEventMap[ye.year]=ye.events);
function incumbentOf(year){
  const inc=DB.presidents.filter(p=>p.from<=year+0.99&&year<p.to);
  return inc.map(p=>(p.termLabel||(typeof p.n==="number"?p.n+"대":p.n))+" "+p.name).join(", ");
}
d3.range(1948,2027).forEach(y=>{
  const x=xOf(y);
  // 마이너 눈금 (짧은 세로선)
  gAxis.append("line").attr("x1",x).attr("x2",x).attr("y1",48).attr("y2",y%10===0?58:55)
    .attr("stroke","var(--muted)").attr("stroke-width",y%10===0?1.4:0.7).attr("opacity",.5);
  // 호버 존 (투명, 해당 연도 전체 폭·높이)
  const hw=(xOf(y+1)-xOf(y))/2+2;
  gYears.append("rect")
    .attr("x",x-hw).attr("y",48).attr("width",hw*2).attr("height",H-80)
    .attr("fill","transparent").style("cursor","crosshair")
    .on("mouseenter",e=>{
      tooltip.style("opacity",1)
        .style("left",Math.min(e.clientX+14,innerWidth-320)+"px").style("top",(e.clientY+12)+"px")
        .html(`<div class="t-name">${y}년</div>
          <div class="t-sub">🏛 ${incumbentOf(y)||"공백기"}</div>
          ${(yearEventMap[y]||[]).map(t=>`<div class="t-sub">• ${t}</div>`).join("")||""}
          ${!yearEventMap[y]?'<div class="t-sub">주요 사건 미등록</div>':""}`);
    })
    .on("mouseleave",()=>tooltip.style("opacity",0));
});

// 재임 기간 막대 (길이 = 실제 재임 기간)
presSorted.forEach(p=>{
  if(isNonPres(p))return;
  const x1=xOf(p.from), x2=Math.max(xOf(p.to),x1+14);
  gBars.append("rect")
    .attr("x",x1).attr("y",MIDY-46).attr("width",x2-x1).attr("height",7).attr("rx",3.5)

// 일반 인물의 x 타깃: 연결된 대통령 x의 평균 (없으면 생년+55)
function targetX(d){
  if(presX[d.id]!=null) return presX[d.id];
  const xs=DATA.edges.filter(e=>e.source===d.id||e.target===d.id)
    .map(e=>presByName[e.source===d.id?e.target:e.source])
    .filter(p=>p&&presX[p.name]!=null).map(p=>presX[p.name]);
  if(xs.length) return xs.reduce((a,b)=>a+b)/xs.length;
  return 80+((d.born+55)-YEAR0)/(YEAR1-YEAR0)*(GRAPH_W-160);
}

    d.fx=presX[d.id];

  }
});

  if(p.real.rateLabel) return {label:p.real.rateLabel,tag:"공식 집계"};
  const w={kept:1,partial:.5,progress:.25,broken:0};
  const items=p.items||[];
  if(!items.length) return {label:"—",tag:""};
  return {pct:Math.round(items.reduce((s,i)=>s+(w[i.status]||0),0)/items.length*100),tag:"자체 집계·보도 기반"};
}
function renderPledges(tabId){
  const tab=OFFICE_TABS.find(t=>t.id===tabId)||OFFICE_TABS[0];
  const elecYear=p=>+((p.meta.match(/(\d{4})/)||[0,0])[1]);
  const list=PLEDGES.filter(tab.match).sort((a,b)=>elecYear(b)-elecYear(a));
  document.getElementById("prom-filter").innerHTML=OFFICE_TABS.map(t=>`<button class="tab-btn ${t.id===tab.id?'on':''}" data-id="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll("#prom-filter button").forEach(b=>b.addEventListener("click",()=>renderPledges(b.dataset.id)));
  document.getElementById("pol-grid").innerHTML=list.map(p=>{
    const r=rateOf(p);
    const scoreHtml=r.pct!=null
      ?`<span class="score">${r.pct}<small>%</small></span>`
      :`<span class="score" style="font-size:20px">${r.label||"집계 없음"}</span>`;
    const detail=p.real.total
      ?`${p.real.total}개 공약 — 완전이행 ${p.real.kept}${p.real.broken?" · 미이행 "+p.real.broken:""}${p.real.na?" · 부분·후퇴 "+p.real.na:""}`
      :p.real.src;
    return `<div class="pol-card">
    <h3>${p.politician}<span class="who">${p.meta}</span></h3>
    <div class="score-row">${scoreHtml}<span class="rate-tag">${r.tag}</span></div>
    <div class="bar"><div style="width:${r.pct||0}%"></div></div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:8px">${detail}</div>
    ${p.items.map(it=>`<details class="promise">
      <summary><span class="st st-${it.status}">${stLabel[it.status]}</span> ${it.title}</summary>
      <div class="evidence">${it.note}
        ${(it.news||[]).map(n=>`<a class="pnews" href="${n.link}" target="_blank" rel="noopener">📄 ${n.title}<br><span>${n.source} · ${n.date}</span></a>`).join("")}
      </div></details>`).join("")}
  </div>`}).join("");
}
renderPledges("all");

// ===== 4) 인물백과 =====
function personSummary(d){
  const n=DB.notes[d.id];
  if(n){const s=n.sections.find(x=>x[0]==="이력")||n.sections[0];if(s)return s[1][0];}
  return d.edu||d.party||"";
}
function renderPeople(){
  const q=(document.getElementById("people-search").value||"").trim().toLowerCase();
  const camp=document.getElementById("people-camp").value;
  const role=document.getElementById("people-role").value;
  const list=DATA.nodes
    .filter(d=>(!q||d.id.toLowerCase().includes(q)||(d.party||"").toLowerCase().includes(q)||(d.president||"").includes(q)||(d.edu||"").toLowerCase().includes(q))
            &&(camp==="all"||d.camp===camp)
            &&(role==="all"||d.role===role||((role==="대통령")&&d.president)))
    .slice().sort((a,b)=>(a.president&&!b.president)?-1:(b.president&&!a.president)?1:(a.role===b.role?a.id.localeCompare(b.id,"ko"):(a.role||"").localeCompare(b.role||"","ko")));
  document.getElementById("people-count").textContent=list.length+"명";
  document.getElementById("people-grid").innerHTML=list.map(d=>`
    <div class="pol-card" style="padding:16px">
      <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px">
        ${d.photo?`<img src="${d.photo}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:top;border:2px solid ${campColor[d.camp]}" onerror="this.style.display='none'">`:`<span style="width:52px;height:52px;border-radius:50%;background:${campColor[d.camp]};display:inline-block"></span>`}
        <div>
          <div style="font-weight:800;font-size:16px">${d.id}</div>
          <div style="font-size:11.5px;color:var(--muted)">${d.president?d.president+" · ":""}${d.party||""}</div>
        </div>
      </div>
      <div style="font-size:12.5px;color:var(--muted);line-height:1.6;min-height:38px">${personSummary(d)}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="tab-btn" data-note="${d.id}" style="font-size:12px;padding:5px 10px">요약 노트</button>
        <a class="tab-btn" href="${WIKI_LINK(d.id)}" target="_blank" rel="noopener" style="font-size:12px;padding:5px 10px;display:inline-block;text-decoration:none">위키백과 전체 ↗</a>
      </div>
    </div>`).join("");
  document.querySelectorAll("#people-grid [data-note]").forEach(b=>b.addEventListener("click",()=>{
    const p=DATA.nodes.find(n=>n.id===b.dataset.note);if(p)openNote(p);
  }));
}
document.getElementById("people-search").addEventListener("input",renderPeople);
document.getElementById("people-camp").addEventListener("change",renderPeople);
document.getElementById("people-role").addEventListener("change",renderPeople);
renderPeople();

// ===== 4.5) 정책백과 =====
const POLICIES=DB.policies||[];
const POL_STATUS_COLOR={완료:"#15803d",진행:"#1d4ed8",일부수정:"#a16207",중단:"#b91c1c",계승:"#0d9488",논란:"#b45309"};
// 정부 필터 옵션 채우기 (정책에 등장하는 정치인 기준)
(function(){
  const sel=document.getElementById("pol-gov");
  const names=[...new Set(POLICIES.flatMap(p=>p.politicians))];
  sel.innerHTML='<option value="all">정부: 전체</option>'+names.map(n=>`<option value="${n}">${n}</option>`).join("");
})();
function renderPolicies(cat){
  const q=(document.getElementById("pol-search").value||"").trim().toLowerCase();
  const gov=document.getElementById("pol-gov").value;
  const cats=["전체",...new Set(POLICIES.map(p=>p.cat))];
  const list=POLICIES
    .filter(p=>(cat==="전체"||!cat||p.cat===cat)&&(!q||p.title.toLowerCase().includes(q)||p.summary.toLowerCase().includes(q)||p.politicians.join(" ").includes(q))&&(gov==="all"||p.politicians.includes(gov)))
    .slice().sort((a,b)=>a.year-b.year);
  document.getElementById("pol-cat").innerHTML=cats.map(c=>`<button class="tab-btn ${c===(cat||"전체")?'on':''}" data-c="${c}">${c}</button>`).join("");
  document.querySelectorAll("#pol-cat button").forEach(b=>b.addEventListener("click",()=>renderPolicies(b.dataset.c)));
  document.getElementById("pol-count").textContent=list.length+"개 정책";
  document.getElementById("policy-list").innerHTML=list.map(p=>`
    <div class="pol-card" style="padding:16px 18px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <b style="font-size:15.5px">${p.title}</b>
        <span class="st" style="background:${POL_STATUS_COLOR[p.status]}18;color:${POL_STATUS_COLOR[p.status]}">${p.status}</span>
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin:6px 0 8px">${p.year} 시작 · ${p.period} · ${p.cat} · ${p.politicians.join("·")} 정부</div>
      <div style="font-size:13px;line-height:1.65">${p.summary}</div>
      <details style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px">
        <summary style="cursor:pointer;font-size:12.5px;color:var(--accent)">상세 보기</summary>
        <div style="font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:8px">
          <b style="color:var(--ink)">배경</b> — ${p.bg}<br>
          <b style="color:var(--ink)">내용</b> — ${p.content}<br>
          <b style="color:var(--ink)">결과</b> — ${p.result}<br>
          <span style="font-size:11px">출처: ${p.src}</span>
        </div>
      </details>
    </div>`).join("")||'<p class="hint">검색 결과가 없습니다.</p>';
}
document.getElementById("pol-search").addEventListener("input",()=>renderPolicies(null));
document.getElementById("pol-gov").addEventListener("change",()=>renderPolicies(null));
renderPolicies("전체");

// ===== 5) 용어 사전 (심플 리스트) =====
const CHO_LIST=["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const choOf=s=>{const c=s.charCodeAt(0)-0xAC00;return (c>=0&&c<11172)?CHO_LIST[Math.floor(c/588)]:s[0].toUpperCase();};
function renderGloss(q){
  q=(q||"").trim().toLowerCase();
  const list=GLOSSARY
    .filter(g=>!q||g.t.toLowerCase().includes(q)||g.cat.includes(q)||g.d.toLowerCase().includes(q))
    .slice().sort((a,b)=>a.t.localeCompare(b.t,"ko"));
  const groups={};
  list.forEach(g=>{const k=choOf(g.t);(groups[k]=groups[k]||[]).push(g)});
  const keys=Object.keys(groups).sort((a,b)=>{
    const ia=CHO_LIST.indexOf(a),ib=CHO_LIST.indexOf(b);
    if(ia>=0&&ib>=0)return ia-ib; if(ia>=0)return -1; if(ib>=0)return 1; return a.localeCompare(b);
  });
  document.getElementById("gloss-count").textContent=list.length+"개 용어";
  document.getElementById("gloss-dict").innerHTML= keys.length
    ? keys.map(k=>`<div class="dict-group"><div class="dict-head">${k}</div>
        ${groups[k].map(g=>`<div class="dict-row">
          <div class="dict-term">${g.t}<span class="cat">${g.cat}</span></div>
          <div><div class="dict-def">${g.d}</div>
            ${(g.news||[]).length?`<div class="dict-news">${g.news.slice(0,2).map(n=>`<a href="${n.link}" target="_blank" rel="noopener">📄 ${n.title.length>44?n.title.slice(0,44)+"…":n.title}</a> <span>${n.source}</span>`).join("")}</div>`:""}
          </div></div>`).join("")}</div>`).join("")
    : '<p class="hint" style="margin-top:20px">검색 결과가 없습니다.</p>';
}
document.getElementById("gloss-search").addEventListener("input",e=>renderGloss(e.target.value));
renderGloss("");

// 관계도 우측 프로필 구역 — 기본 표시 (모든 함수 정의 후)
openNote(DATA.nodes.find(n=>n.id==="이재명")||DATA.nodes[0]);
</script>
